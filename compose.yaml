name: silverbullet-relay
services:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:2.11.1-slim@sha256:07dcc90f41eaa258814080bc3f9af47854e56b23ad0c8c7ffc2ac4bc98568a92
    restart: unless-stopped
    ports: ["127.0.0.1:13000:3000"]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SB_RUNTIME_API: "0"
    volumes:
      - ./runtime/silverbullet:/data
      - ./runtime/space:/space
      - ./libraries/Relay:/space/Library/Relay:ro
    mem_limit: 384m
    pids_limit: 128
  integration-service:
    build:
      context: ./backend
      args:
        HUB_UID: ${PUID:-1000}
        HUB_GID: ${PGID:-1000}
    init: true
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    network_mode: service:silverbullet
    depends_on: [silverbullet]
    environment:
      HUB_CONFIG: /config/integrations.json
      HUB_STATE: /state/state.db
    volumes:
      - ./runtime/config:/config:ro
      - ./runtime/state:/state
      - ./runtime/secrets:/run/secrets:ro
      - ./runtime/calendar:/calendar
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 96
